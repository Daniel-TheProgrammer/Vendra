; Application-wide PHP settings. Environment-specific overrides live in php.dev.ini.

date.timezone = UTC
expose_php = Off

memory_limit = 256M
max_execution_time = 60
max_input_time = 60

upload_max_filesize = 20M
post_max_size = 21M
max_input_vars = 5000

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL

realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.use_strict_mode = 1
