; PHP-FPM pool. Sized for a small container; derive pm.max_children from
; (container memory / average worker RSS) once real traffic numbers exist.

[www]
listen = 9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Used by the Docker HEALTHCHECK and the readiness probe.
ping.path = /ping
ping.response = pong
pm.status_path = /status

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

request_terminate_timeout = 60s
