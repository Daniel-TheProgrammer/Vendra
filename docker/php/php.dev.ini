; Local development overrides (dev image only).

display_errors = On
display_startup_errors = On

opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; pcov is the coverage driver for PHPUnit; keep it scoped to the project tree.
pcov.enabled = 1
pcov.directory = /var/www/html
pcov.exclude = "~/vendor/~"
