# Local development overrides. Loaded automatically by `docker compose`.
# Never used in CI or on servers (they pass -f compose.yaml explicitly).

services:
  app:
    build:
      target: dev
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  nginx:
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    build:
      target: dev
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local

  outbox-relay:
    build:
      target: dev
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local

  scheduler:
    build:
      target: dev
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local

  postgres:
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"

  redis:
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"

  meilisearch:
    environment:
      MEILI_ENV: development
    ports:
      - "${FORWARD_MEILISEARCH_PORT:-7700}:7700"

  mailpit:
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"

  # Forwards Stripe test-mode webhooks to the local API (docs/payments.md).
  # Opt-in: docker compose --profile stripe up -d stripe-cli
  stripe-cli:
    image: stripe/stripe-cli:v1.21.8
    profiles: ["stripe"]
    command:
      - listen
      - --forward-connect-to
      - http://nginx/api/v1/webhooks/stripe
      - --events
      - payment_intent.amount_capturable_updated,payment_intent.processing,payment_intent.succeeded,payment_intent.payment_failed,payment_intent.canceled,charge.refunded,charge.refund.updated,charge.dispute.created
    environment:
      # A test-mode key (sk_test_…) from .env; the CLI refuses to start without one.
      STRIPE_API_KEY: ${STRIPE_SECRET:-}
      STRIPE_DEVICE_NAME: vendra-local
    depends_on:
      - nginx
    restart: unless-stopped
